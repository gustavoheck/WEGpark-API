services:
  database:
    image: postgres:18
    container_name: wegpark
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wegpark-cloudflared
    profiles:
      - tunnel
    command: tunnel --no-autoupdate --protocol http2 --url http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
